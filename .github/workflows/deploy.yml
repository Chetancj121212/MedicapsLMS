name: Deploy Medicaps LMS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: medicaps-lms-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to College Server
    runs-on: self-hosted

    env:
      DOCKER_HOST: npipe:////./pipe/dockerDesktopLinuxEngine

    steps:
      # ---------------------------------------------------------
      # 1. Update server repository
      # ---------------------------------------------------------
      - name: Update server code
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host " Updating Medicaps LMS source code"
          Write-Host "======================================"

          git config --global --add safe.directory F:/CoursePortal

          Set-Location "F:\CoursePortal"

          Write-Host "Current directory:"
          Get-Location

          Write-Host "Fetching latest main branch..."
          git fetch origin main

          Write-Host "Resetting server to origin/main..."
          git reset --hard origin/main

          Write-Host "Current commit:"
          git log -1 --oneline

      # ---------------------------------------------------------
      # 2. Verify Docker
      # ---------------------------------------------------------
      - name: Check Docker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host " Checking Docker"
          Write-Host "======================================"

          Write-Host "Docker endpoint:"
          Write-Host $env:DOCKER_HOST

          Write-Host ""
          Write-Host "Docker version:"
          docker version

          Write-Host ""
          Write-Host "Docker Compose version:"
          docker compose version

      # ---------------------------------------------------------
      # 3. Verify Compose configuration
      # ---------------------------------------------------------
      - name: Validate Docker Compose
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "F:\CoursePortal"

          Write-Host "======================================"
          Write-Host " Validating Docker Compose"
          Write-Host "======================================"

          docker compose config

      # ---------------------------------------------------------
      # 4. Build and deploy
      # ---------------------------------------------------------
      - name: Build and restart LMS
        shell: powershell
        run: |
          Set-Location "F:\CoursePortal"

          Write-Host "======================================"
          Write-Host " Building and starting Medicaps LMS"
          Write-Host "======================================"

          # Safely remove existing containers without aborting on NativeCommandError
          $rmOutput = docker rm -f courseportal-backend-1 courseportal-frontend-1 2>&1 | Out-String
          Write-Host $rmOutput

          # If container is stuck in WSL2 kernel/containerd, auto-recover by restarting WSL
          if ($rmOutput -like "*tried to kill container, but did not receive an exit event*") {
              Write-Host "=========================================================="
              Write-Host " Detected stuck container in WSL2! Performing auto-recovery..."
              Write-Host "=========================================================="
              wsl --shutdown
              Start-Sleep -Seconds 12

              Write-Host "Waiting for Docker daemon to reconnect..."
              for ($i = 0; $i -lt 30; $i++) {
                  docker info 2>&1 | Out-Null
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "Docker daemon reconnected successfully!"
                      break
                  }
                  Start-Sleep -Seconds 2
              }

              docker rm -f courseportal-backend-1 courseportal-frontend-1 2>&1 | Out-Null
          }

          # Start new containers
          docker compose up -d --build --force-recreate
          if ($LASTEXITCODE -ne 0) {
              Write-Host "First compose attempt failed, checking for stuck WSL state..."
              wsl --shutdown
              Start-Sleep -Seconds 12
              for ($i = 0; $i -lt 30; $i++) {
                  docker info 2>&1 | Out-Null
                  if ($LASTEXITCODE -eq 0) { break }
                  Start-Sleep -Seconds 2
              }
              docker compose up -d --build --force-recreate
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Docker compose up failed."
                  exit 1
              }
          }

      # ---------------------------------------------------------
      # 5. Seed initial course catalog
      # ---------------------------------------------------------
      - name: Seed database
        shell: powershell
        run: |
          Set-Location "F:\CoursePortal"

          Write-Host "======================================"
          Write-Host " Seeding course catalog and admin"
          Write-Host "======================================"

          Start-Sleep -Seconds 5
          docker compose exec -T backend python -m app.seed


      # ---------------------------------------------------------
      # 5. Check containers
      # ---------------------------------------------------------
      - name: Check deployment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "F:\CoursePortal"

          Write-Host "======================================"
          Write-Host " Deployment status"
          Write-Host "======================================"

          docker compose ps

          Write-Host ""
          Write-Host "Docker containers:"
          docker ps

      # ---------------------------------------------------------
      # 6. Deployment complete
      # ---------------------------------------------------------
      - name: Deployment complete
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host " MEDICAPS LMS DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================"
          Write-Host ""
